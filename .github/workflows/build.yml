name: Build & Snapshot Release

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Compute snapshot tag
        id: tag
        run: |
          BASE=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          RUN=${{ github.run_number }}
          echo "tag=${BASE}-alpha.${RUN}+${SHA}" >> "$GITHUB_OUTPUT"
          echo "jar_name=cesium-${BASE}-alpha.${RUN}+${SHA}.jar" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Rename jar to snapshot name
        run: |
          BASE=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' ')
          mv build/libs/cesium-${BASE}.jar build/libs/${{ steps.tag.outputs.jar_name }} || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tag }}
          path: build/libs/cesium-*.jar
          if-no-files-found: error

      # Create a pre-release on every push to main
      - name: Delete existing snapshot tag (if any)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAP_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release delete "$SNAP_TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$SNAP_TAG" 2>/dev/null || true

      - name: Create GitHub pre-release (alpha snapshot)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SNAP_TAG: ${{ steps.tag.outputs.tag }}
          SNAP_JAR: ${{ steps.tag.outputs.jar_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          gh release create "$SNAP_TAG" \
            build/libs/cesium-*.jar \
            --prerelease \
            --title "Cesium $SNAP_TAG" \
            --notes "**Alpha Snapshot** — automated build from \`main\`

Commit: \`${COMMIT_SHA:0:7}\` — $COMMIT_MSG

> ⚠️ Bu sürüm geliştirme aşamasındadır. Stabil değildir.

**Kurulum:** \`.minecraft/mods/\` klasörüne kopyala (Fabric 1.21.4 gerekli)"
